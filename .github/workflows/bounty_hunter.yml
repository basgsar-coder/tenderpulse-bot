name: TenderPulse Autonomous Bounty Hunter

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  hunt-bounties:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Pre-commit Guards
        run: |
          python scripts/secret_guard.py

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests/

      - name: Execute Bounty Hunter Cycle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py --dry-run --limit 3

      - name: Commit State & Patches
        run: |
          git config user.name "TenderPulse-Bot"
          git config user.email "bot@tenderpulse.local"
          git add state.json patches/ tenderpulse.db || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(telemetry): update bounty hunter state [skip ci]" && git push)
