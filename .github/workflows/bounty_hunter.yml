name: TenderPulse Autonomous Bounty Hunter

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Fix 5: Concurrency group prevents overlapping runner collisions
concurrency:
  group: tenderpulse-bounty-hunter-${{ github.repository }}
  cancel-in-progress: false

jobs:
  hunt-bounties:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fix 17: Least privilege (only contents: write for state commits)
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Secret Guard
        run: |
          python scripts/secret_guard.py

      - name: Run Test Suite
        run: |
          python -m unittest discover tests/

      # Fix 1: Pass BOUNTY_BOT_TOKEN for external PR submissions
      # Fix 12: Pass GEMINI_API_KEY / OPENAI_API_KEY
      - name: Execute Bounty Hunter Cycle (LIVE)
        env:
          BOUNTY_BOT_TOKEN: ${{ secrets.BOUNTY_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python main.py --live --limit 1

      # Fix 5 & 18: Always commit state/patches, exclude DB, rebase retry loop
      - name: Commit State & Patches
        if: always()
        run: |
          git config user.name "TenderPulse-Bot"
          git config user.email "bot@tenderpulse.local"
          git add state.json patches/ || true
          
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          
          git commit -m "chore(telemetry): update bounty hunter state [skip ci]"
          
          # Retry loop for safe pushing
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash || true
            sleep 5
          done
          exit 1
